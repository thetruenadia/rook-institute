name: EEB-1 Experiment 14 reproduction
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/eeb1-e14.yml'
      - 'Project-II-EEB1/Experiment-014/**'
permissions:
  contents: read
jobs:
  reproduce:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
        working-directory: Project-II-EEB1/Experiment-014
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.5'
      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify archived source and inputs
        run: sha256sum -c archive-source-sha256.txt
      - name: Execute twice and verify repeatability
        run: |
          set -euo pipefail
          mkdir -p runs/first runs/second
          python --version
          python -m pip freeze > runs/environment.txt
          outputs=(sweep.csv timeseries.csv profiles.csv timestep_check.csv spatial_check.csv results.json)
          for run in first second; do
            python column.py | tee "runs/$run/execution.log"
            cp "${outputs[@]}" "runs/$run/"
            (cd "runs/$run" && sha256sum "${outputs[@]}" > SHA256SUMS.txt)
          done
          diff -u runs/first/SHA256SUMS.txt runs/second/SHA256SUMS.txt | tee runs/repeatability.txt
          echo "Two runs produced identical output hashes." | tee -a runs/repeatability.txt
          if sha256sum -c archive-output-sha256.txt > runs/archive-comparison.txt 2>&1; then
            echo "All six outputs match the historical archive." >> runs/archive-comparison.txt
          else
            echo "Historical byte comparison failed; numerical review required." >> runs/archive-comparison.txt
            echo "::warning::Historical output hashes differ; do not claim exact historical reproduction."
          fi
          cat runs/archive-comparison.txt
      - name: Preserve results and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: EEB1-E14-reproduction
          path: Project-II-EEB1/Experiment-014/runs/
          if-no-files-found: warn
